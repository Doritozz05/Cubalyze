<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f8f9fa" />
  <script src="/theme-color.js"></script>
  <meta name="description"
    content="CubeForge — Smart Cube Training Platform, Algorithm Database & Speedcubing Analytics" />
  <meta property="og:title" content="CubeForge — Smart Cube Training Platform" />
  <meta property="og:description"
    content="Master speedcubing with smart cube tracking, real-time analytics, and comprehensive algorithm databases." />
  <meta property="og:type" content="website" />
  <title>cubeforge — Smart cube training platform & speedcubing analytics</title>
</head>

<body>
  <!-- Pre-paint theme bootstrap (external, not inline): sets .dark before the
       bundle loads so the root loader and first paint match the saved theme.
       Kept in a separate file because the production Content-Security-Policy
       uses `script-src 'self'` without 'unsafe-inline' (see theme-color.js). -->
  <script src="/theme-bootstrap.js"></script>
  <style>
      #root-loader-wrapper {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #f8f9fa;
        color: #14171b;
        z-index: 9999;
      }
      html.dark #root-loader-wrapper {
        background-color: #14171b;
        color: #f8f9fa;
      }
      .cf-rubik-lateral-root {
        --offset: 18px;
        --sq: 14px;
        position: relative;
        width: calc(3 * var(--offset) + var(--sq));
        height: calc(2 * var(--offset) + var(--sq));
      }
      .cf-rubik-sq-root {
        position: absolute;
        left: 0;
        top: 0;
        width: var(--sq);
        height: var(--sq);
        border-radius: 2.5px;
        will-change: transform;
      }
      /* Colors match the app spinner tokens (--phase-orange / --phase-blue).
         Every square has a BASE transform = its slot, so the cube shape is
         always complete — even on a soft reload where the browser reuses
         cached animation state, and under reduced motion. Positions animate
         via transform (GPU-composited, no layout thrash) and every loop is
         SEAMLESS (100% == 0%), so the flow never jumps or teleports at the
         cycle boundary. No start delay and no staggered fade-in: all squares
         are visible and animating from the very first frame. */
      .cf-sq1-r { background-color: #fb923c; transform: translate3d(0px, 0px, 0); animation: cf-sq1-r 2.4s ease-in-out infinite; }
      .cf-sq2-r { background-color: #60a5fa; transform: translate3d(0px, 18px, 0); animation: cf-sq2-r 2.4s ease-in-out infinite; }
      .cf-sq3-r { background-color: #fbbf24; transform: translate3d(18px, 18px, 0); animation: cf-sq3-r 2.4s ease-in-out infinite; }
      .cf-sq4-r { background-color: #34d399; transform: translate3d(36px, 18px, 0); animation: cf-sq4-r 2.4s ease-in-out infinite; }
      .cf-sq5-r { background-color: #a78bfa; transform: translate3d(54px, 18px, 0); animation: cf-sq5-r 2.4s ease-in-out infinite; }

      @keyframes cf-sq1-r {
        0% { transform: translate3d(0px, 0px, 0); }
        8.333% { transform: translate3d(0px, 18px, 0); }
        100% { transform: translate3d(0px, 0px, 0); }
      }
      @keyframes cf-sq2-r {
        0% { transform: translate3d(0px, 18px, 0); }
        8.333% { transform: translate3d(0px, 36px, 0); }
        16.67% { transform: translate3d(18px, 36px, 0); }
        25.00% { transform: translate3d(18px, 18px, 0); }
        83.33% { transform: translate3d(18px, 18px, 0); }
        91.67% { transform: translate3d(18px, 0px, 0); }
        100% { transform: translate3d(0px, 18px, 0); }
      }
      @keyframes cf-sq3-r {
        0%, 100% { transform: translate3d(18px, 18px, 0); }
        16.67% { transform: translate3d(18px, 18px, 0); }
        25.00% { transform: translate3d(18px, 0px, 0); }
        33.33% { transform: translate3d(36px, 0px, 0); }
        41.67% { transform: translate3d(36px, 18px, 0); }
        66.67% { transform: translate3d(36px, 18px, 0); }
        75.00% { transform: translate3d(36px, 36px, 0); }
        83.33% { transform: translate3d(18px, 36px, 0); }
        91.67% { transform: translate3d(18px, 18px, 0); }
      }
      @keyframes cf-sq4-r {
        0%, 100% { transform: translate3d(36px, 18px, 0); }
        33.33% { transform: translate3d(36px, 18px, 0); }
        41.67% { transform: translate3d(36px, 36px, 0); }
        50.00% { transform: translate3d(54px, 36px, 0); }
        58.33% { transform: translate3d(54px, 18px, 0); }
      }
      @keyframes cf-sq5-r {
        0%, 100% { transform: translate3d(54px, 18px, 0); }
        50.00% { transform: translate3d(54px, 18px, 0); }
        58.33% { transform: translate3d(54px, 0px, 0); }
        66.67% { transform: translate3d(36px, 0px, 0); }
        75.00% { transform: translate3d(36px, 18px, 0); }
      }
      @media (prefers-reduced-motion: reduce) {
        .cf-sq1-r, .cf-sq2-r, .cf-sq3-r, .cf-sq4-r, .cf-sq5-r { animation: none; }
      }

      /* Smooth hand-off to the app: the overlay shares the app's background, so
         main.tsx fades it out (opacity) once React has mounted underneath —
         no hard cut and no white flash on reload. */
      #root-loader-wrapper {
        transition: opacity 0.45s ease-out;
      }
      #root-loader-wrapper.cf-loader-hidden {
        opacity: 0;
        pointer-events: none;
      }
      @media (prefers-reduced-motion: reduce) {
        #root-loader-wrapper {
          transition: none;
        }
      }
    </style>
    <div id="root"></div>
    <div id="root-loader-wrapper">
      <div class="cf-rubik-lateral-root" role="img" aria-label="Loading">
        <div class="cf-rubik-sq-root cf-sq1-r"></div>
        <div class="cf-rubik-sq-root cf-sq2-r"></div>
        <div class="cf-rubik-sq-root cf-sq3-r"></div>
        <div class="cf-rubik-sq-root cf-sq4-r"></div>
        <div class="cf-rubik-sq-root cf-sq5-r"></div>
      </div>
    </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
