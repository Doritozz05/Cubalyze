name: Quality Gates (Nivel 3)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        name: Build packages
      - run: pnpm -r exec tsc --noEmit
        name: Typecheck (0 errors required)

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
        name: Lint (0 errors, 0 warnings)
      - run: pnpm lint:lines
        name: TDD-0006 line gate (no new files >1000 lines)

  commitlint:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Lint PR commit messages
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
      - name: Lint push commit message (squash)
        if: github.event_name == 'push'
        run: pnpm exec commitlint --from HEAD~1 --verbose

  unit-tests:
    name: Unit Tests (Nivel 1-3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        name: Build packages
      - run: pnpm -r exec vitest run --passWithNoTests
        name: All tests (100% pass required)

  benchmarks:
    name: Benchmark Thresholds
    # Disabled in CI: performance timing thresholds are non-deterministic on shared GitHub Actions runners
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        name: Build packages
      - run: pnpm --filter @cubeforge/solver-engine exec vitest run src/__tests__/benchmarks.test.ts
        name: Solver engine benchmarks
      - run: pnpm --filter @cubeforge/analysis-engine exec vitest run src/__tests__/benchmarks.test.ts
        name: Analysis engine benchmarks


  coverage:
    name: Test Coverage (core packages)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        name: Build packages
      - run: |
          pnpm --filter @cubeforge/math-core exec vitest run --coverage
          pnpm --filter @cubeforge/solver-engine exec vitest run --coverage
          pnpm --filter @cubeforge/analysis-engine exec vitest run --coverage
          pnpm --filter @cubeforge/timer-engine exec vitest run --coverage
          pnpm --filter @cubeforge/database exec vitest run --coverage
        name: Coverage (core packages, >80% lines)

  property-based:
    name: Property-Based Tests (fast-check)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        name: Build packages
      - run: pnpm --filter @cubeforge/solver-engine exec vitest run src/__tests__/property-based.test.ts
        name: Property-based tests (0 failures required)
